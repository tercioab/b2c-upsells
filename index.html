<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<meta content="#FFF8EC" name="theme-color"/>
<title>Raspadinha da Sorte — Páginas</title>
<link href="PROSTA-REDUX/assets/10_css2.css" rel="stylesheet"/>
<style>
:root{--bg:#FFF8EC;--text:#2A1810;--text-2:#6B5646;--paper:#FFFFFF;--line:#F0E6D8;--red:#C41E1E;--go:#1C9E48;--go-dark:#137A36;--gold:#FFC933;--shadow:0 1px 0 rgba(120,60,0,.06),0 8px 22px rgba(120,60,0,.10);--shadow-lg:0 14px 32px rgba(120,60,0,.20);--f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#FFE3A6 0%,#FFF1D6 40%,var(--bg) 100%);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:min(760px,100%);margin:0 auto;padding:40px 16px 56px}
header{text-align:center;margin-bottom:28px}
.kicker{margin:0;color:var(--red);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
h1{margin:4px 0 6px;font-family:var(--f-cond);font-weight:800;font-size:clamp(34px,7vw,48px);line-height:1;text-transform:uppercase}
header p{margin:0;color:var(--text-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.shot{aspect-ratio:4/3;display:grid;place-items:center;background:#FFF4E0;padding:16px}
.shot img{width:100%;height:100%;object-fit:contain}
.body{display:grid;gap:4px;padding:16px 18px 18px}
.body h2{margin:0;font-family:var(--f-cond);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase}
.meta{margin:0;color:var(--text-2);font-size:15px}
.path{margin:2px 0 10px;font-size:13px;color:var(--text-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.btn{display:block;text-align:center;background:var(--go);color:#fff;font-weight:700;font-size:17px;padding:12px 16px;border-radius:12px;box-shadow:0 3px 0 var(--go-dark)}
.card:hover .btn{background:var(--go-dark)}
</style>
</head>
<body>
<div class="wrap">
<header>
<p class="kicker">Raspadinha da Sorte</p>
<h1>Páginas de upsell</h1>
<p>Escolha qual página abrir.</p>
</header>

<nav class="grid" aria-label="Páginas">
<a class="card" href="PROSTA-REDUX/index.html">
<div class="shot"><img alt="5 frascos de Prosta Redux" decoding="async" src="PROSTA-REDUX/assets/base-mockups-potes%20copiar.webp"/></div>
<div class="body">
<h2>Prosta Redux</h2>
<p class="meta">+5 frascos · 70% OFF · 12x de R$28,01</p>
<p class="path">/PROSTA-REDUX/</p>
<span class="btn">Abrir página</span>
</div>
</a>

<a class="card" href="RASPADINHA-VIRIL/index.html">
<div class="shot"><img alt="3 frascos de Viril Plus" decoding="async" src="RASPADINHA-VIRIL/assets/base-mockups-potes%20copiar.png"/></div>
<div class="body">
<h2>Viril Plus</h2>
<p class="meta">+3 frascos · 70% OFF · 12x de R$29,82</p>
<p class="path">/RASPADINHA-VIRIL/</p>
<span class="btn">Abrir página</span>
</div>
</a>
</nav>
</div>
</body>
</html>
